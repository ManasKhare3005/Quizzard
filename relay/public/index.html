<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzard Relay</title>
<style>
  :root { --bg: #f3efe6; --ink: #1f1a2e; --muted: #6f6a7d; --plum: #5b3fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14121c; --ink: #f1edf9; --muted: #a39db3; --plum: #a893ff; } }
  :root[data-theme="dark"] { --bg: #14121c; --ink: #f1edf9; --muted: #a39db3; --plum: #a893ff; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, sans-serif; padding: 48px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 34px; }
  p { color: var(--muted); }
  code { color: var(--plum); }
</style>
</head>
<body>
  <main>
    <h1>🧙 Quizzard</h1>
    <p>The relay behind the Quizzard Cubbie Skill: group quiz battles in your group chat, with points, check-ins and a monthly scorecard. Last place treats the group.</p>
    <p>Add Cubbie to your group chat and type <code>@test</code>.</p>
  </main>
</body>
</html>
